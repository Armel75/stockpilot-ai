[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # Depends() dans les signatures FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # lignes longues acceptées dans les tests (lisibilité)
"app/ingestion/seed.py" = ["E501"]  # données de démo tabulaires (lisibilité)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
